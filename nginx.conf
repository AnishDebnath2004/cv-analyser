# Nginx Reverse Proxy Configuration with Security Protections
# Place in /etc/nginx/conf.d/ or include in nginx.conf

server {
    listen 80;
    server_name _;

    # Block public HTTP access to .env files and sensitive dotfiles
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
        return 403 "Forbidden: Access to sensitive environment files is blocked.\n";
    }

    # Reverse proxy for API backend (FastAPI / Uvicorn)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Static frontend assets
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
