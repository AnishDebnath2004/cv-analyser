# Nginx Reverse Proxy Configuration with Security Protections
# Place in /etc/nginx/conf.d/ or include in nginx.conf

server {
    listen 80;
    server_name _;

    # Security Headers: Strict Content Security Policy (CSP), Anti-Clickjacking & Transport Security
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' https://npiudrqpunpcrpautaif.supabase.co https://*.supabase.co; worker-src 'self' blob:;" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Block public HTTP access to .env files and sensitive dotfiles
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
        return 403 "Forbidden: Access to sensitive environment files is blocked.\n";
    }

    # Reverse proxy for API backend (FastAPI / Uvicorn)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Static frontend assets
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
